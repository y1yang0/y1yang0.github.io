  <title id="title">West Lake, Hangzhou</title>
  <desc id="desc">A quiet paper-cut impression of West Lake: layered green hills, a vermilion sun, a lakeside pagoda, an arched stone bridge, willow branches and three small stone towers reflected in the water.</desc>

