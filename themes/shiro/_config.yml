# Default theme settings; site overrides live in _config.shiro.yml.
menu: []

site:
  favicon: /favicon.svg
  rss:
    enabled: false
    path: /atom.xml

article:
  # Whether to display the TOC button in the post page
  show_toc: true

archive:
  # First year drawn as the AI era on the archive timeline
  # Years annotated beside their label on the archive timeline
  milestones:
    2026: AI era
    2025: Novel
    2020: COVID pandemic

# Analytics
analytics:
  # Only support Google Analytics 4
  google:
    enabled: false
    id: ""
  # Microsoft Clarity
  clarity:
    enabled: false
    id: ""

# Comment systems
comments:
  enabled: false
  provider: disqus
  disqus:
    shortname: ""

# Excerpt settings
excerpt:
  # If post has <!-- more -->, use it.
  # Otherwise fallback to auto-truncated excerpt.
  fallback:
    enabled: true
    length: 200
journal:
  motto: '致广大，尽精微。'
