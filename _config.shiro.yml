  enabled: true
  provider: disqus
  disqus:
    shortname: ""

# Excerpt settings
excerpt:
  fallback:
    enabled: true
    length: 200

# Homepage copy; the name comes from author in _config.yml.
journal:
  motto: '致广大，尽精微。'
