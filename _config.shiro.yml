# Navigation menu
menu:
 - name: Home
   url: /
 - name: Archives
   url: /archives
 - name: Journal
   url: /2026/09/30/travel-journal/
   section: journal
 - name: About
   url: /about
 - name: GitHub
   url: https://github.com/y1yang0
   # Open in new tab
   target: _blank

site:
  favicon: /favicon.svg
  rss:
    enabled: false
    path: /atom.xml

article:
  show_toc: true

# Analytics
analytics:
  # Only support Google Analytics 4
  google:
    enabled: false
    id: ""

